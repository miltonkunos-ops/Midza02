<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saints Trek Point Ledger</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #4caf50;
      --accent-hover: #45a049;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #f44336;
      --input-bg: #2a2a2a;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .user-badge {
      background: var(--accent);
      color: #000;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    .stat-box {
      background: var(--input-bg);
      padding: 12px;
      border-radius: 8px;
    }
    .stat-val {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .stat-val.profit { color: var(--accent); }
    .stat-val.expense { color: var(--danger); }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }
    button.btn-main {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }
    button.btn-main:hover {
      background: var(--accent-hover);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    th { color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Saints Trek Point</h2>
    <span class="user-badge">Milton</span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('sell', this)">Sell</button>
    <button class="tab-btn" onclick="switchTab('stock', this)">Stock</button>
    <button class="tab-btn" onclick="switchTab('expenses', this)">Expenses</button>
    <button class="tab-btn" onclick="switchTab('history', this)">History</button>
  </div>

  <!-- DASHBOARD / PROFIT TRACKING -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="card">
      <h3>Financial Overview</h3>
      <div class="grid">
        <div class="stat-box">
          <small>Total Revenue</small>
          <div id="summary-sales" class="stat-val">$0.00</div>
        </div>
        <div class="stat-box">
          <small>COGS (Item Costs)</small>
          <div id="summary-cogs" class="stat-val expense">$0.00</div>
        </div>
        <div class="stat-box">
          <small>Other Expenses</small>
          <div id="summary-expenses" class="stat-val expense">$0.00</div>
        </div>
        <div class="stat-box">
          <small>Net Profit</small>
          <div id="summary-profit" class="stat-val profit">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SELL TAB -->
  <div id="tab-sell" class="tab-content">
    <div class="card">
      <h3>Record Sale</h3>
      <form id="sales-form" onsubmit="recordSale(event)">
        <select id="sale-item-select" required onchange="updateSaleMax()">
          <option value="">Select Item</option>
        </select>
        <input type="number" id="sale-qty" placeholder="Quantity" min="1" required>
        <button type="submit" class="btn-main">Complete Sale</button>
      </form>
    </div>
  </div>

  <!-- STOCK & UNIT COST TAB -->
  <div id="tab-stock" class="tab-content">
    <div class="card">
      <h3>Add Inventory / Items</h3>
      <form id="stock-form" onsubmit="addStock(event)">
        <input type="text" id="item-name" placeholder="Item Name" required>
        <input type="number" step="0.01" id="item-unit-cost" placeholder="Unit Cost ($)" required>
        <input type="number" step="0.01" id="item-selling-price" placeholder="Selling Price ($)" required>
        <input type="number" id="item-qty" placeholder="Quantity in Stock" min="0" required>
        <button type="submit" class="btn-main">Save Item</button>
      </form>
    </div>

    <div class="card">
      <h3>Current Stock</h3>
      <table>
        <thead>
          <tr>
