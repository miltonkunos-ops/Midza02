<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saints Trek Point Ledger</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #4caf50;
      --accent-hover: #45a049;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --danger: #f44336;
      --input-bg: #2a2a2a;
      --border-color: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .user-badge {
      background: var(--accent);
      color: #000;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }
    .stat-box {
      background: var(--input-bg);
      padding: 12px;
      border-radius: 8px;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .stat-val.profit { color: var(--accent); }
    .stat-val.expense { color: var(--danger); }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button.btn-main {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn-main:hover {
      background: var(--accent-hover);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    th { color: var(--text-muted); font-size: 0.8rem; }
    .sync-status {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 style="margin:0;">Saints Trek Point</h2>
      <div id="sync-indicator" class="sync-status">Connecting to Firebase...</div>
    </div>
    <span class="user-badge">Milton</span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
    <button class="tab-btn" onclick="switchTab('sell', this)">Sell</button>
    <button class="tab-btn" onclick="switchTab('stock', this)">Stock</button>
